<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shield match intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#151b24; --bg2:#1c2430; --line:#2b3545; --ink:#ebe7df; --mute:#98a2b0;
    --amber:#f2b35b; --danger:#ff6a4d; --home:#f3efe6; --away:#6f8fb8; --pitch:#2f5a41; --pitch2:#335f46;
    --ok:#7bc9a0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,sans-serif;font-size:15px;line-height:1.45}
  button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer}
  button:hover{border-color:var(--mute)} button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  button.on{background:var(--amber);color:#1a1408;border-color:var(--amber)}
  select,input{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:5px 8px}
  a{color:var(--amber)}
  .cond{font-family:"Barlow Condensed",Barlow,sans-serif}
  header{display:flex;align-items:center;gap:18px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .score{display:flex;align-items:baseline;gap:10px;font-family:"Barlow Condensed";font-weight:600}
  .score .club{font-size:20px;letter-spacing:.2px}
  .score .num{font-size:34px;line-height:1;padding:0 6px;background:var(--bg2);border-radius:4px;min-width:38px;text-align:center}
  .score .home{color:var(--home)} .score .away{color:var(--away)}
  .clock{font-family:"Barlow Condensed";font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;min-width:74px}
  .transport{display:flex;gap:6px;align-items:center}
  .tabs{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
  .tabs button{border-color:transparent;color:var(--mute);padding:6px 8px}
  #feedStatus{font-variant-numeric:tabular-nums;white-space:nowrap}
  .tabs button.on{background:none;color:var(--ink);border-bottom:2px solid var(--amber);border-radius:0}
  main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,.9fr);gap:0}
  @media (max-width:900px){main{grid-template-columns:1fr}}
  .stage{position:relative;padding:12px 0 12px 16px}
  @media (max-width:900px){.stage{padding:12px 16px}}
  canvas{width:100%;display:block;border-radius:6px;background:var(--pitch)}
  .caption{position:absolute;left:28px;top:24px;max-width:60%;background:rgba(21,27,36,.88);border-left:3px solid var(--amber);padding:8px 12px;font-family:"Barlow Condensed";font-size:20px;font-weight:600;letter-spacing:.2px;pointer-events:none;opacity:0;transition:opacity .25s}
  .caption.show{opacity:1}
  .caption small{display:block;font-family:Barlow;font-weight:400;font-size:13px;color:var(--mute)}
  .scrub{width:100%;margin:8px 0 0}
  .timeline{position:relative;height:38px;margin-top:2px}
  .timeline .tick{position:absolute;top:4px;width:10px;height:10px;border-radius:50%;transform:translateX(-50%);border:0;padding:0;cursor:pointer}
  .timeline .tick.goal{background:var(--amber);width:14px;height:14px;top:2px}
  .timeline .tick.chance{background:var(--home);opacity:.7}
  .timeline .tick.stop{background:var(--ok)}
  .timeline .tick.key_pass{background:none;border:2px solid var(--amber);width:8px;height:8px;top:5px}
  .timeline .tick.milestone{display:none}
  .timeline .tick.momentum_shift,.timeline .tick.chaos{background:none;border:1px solid var(--mute);width:8px;height:8px;top:5px}
  .timeline .half{position:absolute;top:20px;font-size:11px;color:var(--mute)}
  .legend{font-size:12px;color:var(--mute);display:flex;gap:14px;margin-top:4px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .panel{padding:12px 16px;border-left:1px solid var(--line);min-height:70vh}
  @media (max-width:900px){.panel{border-left:0;border-top:1px solid var(--line)}}
  h2{font-family:"Barlow Condensed";font-weight:600;font-size:22px;margin:4px 0 8px}
  h3{font-family:"Barlow Condensed";font-weight:600;font-size:17px;margin:14px 0 6px;color:var(--mute)}
  .story{font-size:16px;line-height:1.55;max-width:60ch}
  .story p{margin:0 0 10px}
  .why{font-size:13px;color:var(--mute)}
  .facts{font-size:13px;border-top:1px solid var(--line);margin-top:8px;padding-top:6px;display:none}
  .trace{display:none;border-top:1px solid var(--line);margin-top:8px;padding-top:6px;font-size:13px} .trace.open{display:block}
  .tstep{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)} .tstep .who{font-family:"Barlow Condensed";font-weight:600;font-size:15px} .tstep .who small{display:block;font-family:Barlow;font-weight:400;font-size:11px;color:var(--mute)} .tstep .what{color:var(--mute)} .tstep .txt{color:var(--ink);margin-top:3px;font-size:12.5px;line-height:1.4} .tstep .bad{color:var(--danger);text-decoration:line-through} .tstep .v{color:var(--ok)} .tstep .v.no{color:var(--danger)}
  .facts.open{display:block}
  .facts div{padding:3px 0;display:flex;gap:8px}
  .facts code{color:var(--amber);font-family:"Barlow Condensed";font-size:14px;min-width:28px}
  .facts button{padding:0 6px;font-size:12px;border-color:transparent;color:var(--mute)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px 14px;margin:8px 0}
  .tile b{display:block;font-family:"Barlow Condensed";font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .tile span{font-size:12px;color:var(--mute)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  td,th{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  th{color:var(--mute);font-weight:500}
  td.n,th.n{text-align:right}
  .bar{height:8px;background:var(--bg2);border-radius:3px;overflow:hidden;position:relative}
  .bar i{display:block;height:100%;background:var(--home)}
  .bar.away i{background:var(--away)}
  .mom{display:grid;grid-template-columns:70px 1fr 54px;gap:8px;align-items:center;font-size:12px;color:var(--mute);margin:2px 0}
  .mom .split{height:10px;display:flex;border-radius:3px;overflow:hidden}
  .mom .split i{display:block;height:100%}
  .arch{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin:6px 0 10px}
  .arch button{text-align:left;padding:8px 10px;border-radius:6px}
  .arch button b{display:block;font-family:"Barlow Condensed";font-size:18px;font-weight:600}
  .arch button span{font-size:12px;color:var(--mute)}
  .arch button.on span{color:#3a2d10}
  .hbar{display:grid;grid-template-columns:120px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
  .hbar .bar i{background:var(--amber)}
  .drill{border-left:2px solid var(--line);padding:4px 10px;margin:6px 0;font-size:14px}
  .drill b{font-family:"Barlow Condensed";font-size:16px}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;max-width:360px;margin:6px 0}
  .form label{font-size:12px;color:var(--mute)} .form input{width:100%}
  .note{font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
  .pill{display:inline-block;font-size:12px;padding:1px 7px;border:1px solid var(--line);border-radius:10px;color:var(--mute);margin-left:6px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
  .cf{background:var(--bg2);border-radius:6px;padding:10px 12px;margin-top:8px;font-size:14px}
  .cf b.big{font-family:"Barlow Condensed";font-size:28px;font-weight:600;margin-right:6px}
  .loading{padding:40px;color:var(--mute)}
  .vbox{position:absolute;left:28px;bottom:118px;max-width:44%;background:rgba(21,27,36,.9);border-left:3px solid #7bc9a0;padding:8px 12px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s}
  .vbox.show{opacity:1} .vbox.right{left:auto;right:12px} .vbox b{font-family:"Barlow Condensed";font-size:17px;font-weight:600;display:block;margin-bottom:2px} .vbox .opt{display:flex;gap:8px;color:var(--mute)} .vbox .opt i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-top:5px} .vbox .k{color:var(--ink)}
  canvas{cursor:crosshair}
  ol.looks{padding-left:20px;margin:4px 0} ol.looks li{margin:8px 0;display:grid;grid-template-columns:1fr 200px;gap:12px;align-items:center} ol.looks li canvas{width:200px;height:130px;border-radius:4px;background:var(--pitch)} @media (max-width:520px){ol.looks li{grid-template-columns:1fr} ol.looks li canvas{width:100%;height:auto}} ol.looks button{padding:0 6px;font-size:12px;border-color:transparent;color:var(--amber)}
  .points{display:grid;gap:6px;margin:6px 0} .point{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:start;border-top:1px solid var(--line);padding-top:6px;font-size:14px} .point .min{font-size:22px;font-weight:600;line-height:1} .point .row{margin:0}
  .tag{position:absolute;pointer-events:none}
  @media (prefers-reduced-motion:reduce){.caption{transition:none}}
</style>
</head>
<body>
<header>
  <div class="score">
    <span class="club home" id="homeName">Home</span><span class="num home" id="homeGoals">0</span>
    <span class="num away" id="awayGoals">0</span><span class="club away" id="awayName">Away</span>
  </div>
  <div class="clock" id="clock">00:00</div>
  <div class="transport">
    <button id="play" aria-label="Play or pause">Play</button>
    <button id="spd1" class="on">1×</button><button id="spd4">4×</button><button id="spd16">16×</button>
    <button id="live" title="Hide anything the engine has not seen yet">Live</button>
    <button id="feed" title="Stream the match from the server as a live feed">Live feed</button>
    <button id="see" class="on" title="Click any player on the pitch to see what he sees">What he sees</button>
    <span class="pill" id="feedStatus" hidden></span>
  </div>
  <nav class="tabs" aria-label="Viewing mode">
    <button data-mode="casual" class="on">Fan</button>
    <button data-mode="analyst">Analyst</button>
    <button data-mode="player">Player focus</button>
    <button data-mode="kid">Play like your idol</button>
  </nav>
</header>
<main>
  <section class="stage">
    <canvas id="pitch" width="1050" height="680" aria-label="Pitch replay"></canvas>
    <div class="caption" id="caption"></div>
    <div class="vbox" id="vbox"></div>
    <input class="scrub" type="range" id="scrub" min="0" max="5399" value="0" aria-label="Match clock">
    <div class="timeline" id="timeline"></div>
    <div class="legend"><span><i style="background:var(--amber)"></i>goal</span><span><i style="background:var(--home);opacity:.7"></i>chance</span><span><i style="background:var(--ok)"></i>attack stopped</span><span><i style="border:2px solid var(--amber)"></i>key pass</span><span><i style="border:1px solid var(--mute)"></i>momentum / chaos</span></div>
  </section>
  <aside class="panel" id="panel"><div class="loading">Loading match…</div></aside>
</main>
<script>
const $=s=>document.querySelector(s);
let B=null, clock=0, playing=false, speed=1, mode='casual', focus='H06', lang='en', liveOnly=true, lastTs=0;
let freeze=null; // {moment, ghost:0..1 or null}
let feed=null, feedItem=null, feedStats={engine:null,narr:null,n:0}; let club='home';
let sel=null, visionOn=true, lastV=null, lastVboxAt=0;
const fmt=t=>`${String(Math.floor(t/60)).padStart(2,'0')}:${String(Math.floor(t%60)).padStart(2,'0')}`;
const name=pid=>B.meta.players.find(p=>p.id===pid)?.name||pid;
const short=pid=>{const n=name(pid).split(' ');return n[n.length-1]};
const teamOf=pid=>B.meta.players.find(p=>p.id===pid)?.team;
const clubs=()=>B.meta.clubs;

fetch('data/bundle.json').then(r=>r.json()).then(b=>{B=b;init()});

function init(){
  $('#homeName').textContent=clubs().home; $('#awayName').textContent=clubs().away;
  buildTimeline();
  $('#play').onclick=()=>{playing=!playing;$('#play').textContent=playing?'Pause':'Play';if(playing)freeze=null;};
  for(const s of [1,4,16]) $('#spd'+s).onclick=()=>{speed=s;for(const k of [1,4,16])$('#spd'+k).classList.toggle('on',k===s)};
  $('#live').classList.toggle('on',liveOnly);
  $('#live').onclick=()=>{liveOnly=!liveOnly;$('#live').classList.toggle('on',liveOnly);lastTickSec=-1;renderPanel()};
  $('#scrub').oninput=e=>{clock=+e.target.value;freeze=null;renderPanel()};
  $('#feed').onclick=toggleFeed;
  $('#see').onclick=()=>{visionOn=!visionOn;$('#see').classList.toggle('on',visionOn);if(visionOn&&!sel)sel=focus;if(!visionOn)$('#vbox').classList.remove('show')};
  $('#pitch').onclick=e=>{const r=$('#pitch').getBoundingClientRect();const px=(e.clientX-r.left)*PW/r.width,py=(e.clientY-r.top)*PH/r.height;const x=(px-PAD)/(PW-2*PAD)*L,y=(py-PAD)/(PH-2*PAD)*W;const row=frameAt(clock);let best=null,bd=2.6;for(const pid of B.frames.ids){const [qx,qy]=pos(row,pid);const d=Math.hypot(qx-x,qy-y);if(d<bd){best=pid;bd=d}}
    if(best){sel=best;visionOn=true;$('#see').classList.add('on');if(mode==='player'||mode==='kid'){if(B.fingerprints[best]){focus=best;renderPanel()}}}else{sel=null;$('#vbox').classList.remove('show')}};
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));renderPanel()});
  renderPanel();
  requestAnimationFrame(loop);
}

function loop(ts){
  if(playing&&!feed){const dt=(ts-lastTs)/1000*speed;clock=Math.min(B.clock,clock+dt);if(clock>=B.clock){playing=false;$('#play').textContent='Play'}}
  lastTs=ts;
  if(freeze&&freeze.ghost!==null&&freeze.ghost<1){freeze.ghost=Math.min(1,freeze.ghost+0.012)}
  draw();
  $('#clock').textContent=fmt(clock); $('#scrub').value=clock;
  const sc=scoreAt(clock); $('#homeGoals').textContent=sc.home; $('#awayGoals').textContent=sc.away;
  if(playing && Math.floor(clock)%2===0) refreshLive();
  updateTicks();
  requestAnimationFrame(loop);
}
let lastLiveSec=-1;
function refreshLive(){const s=Math.floor(clock);if(s!==lastLiveSec){lastLiveSec=s;if(mode==='player'||mode==='analyst')renderPanel()}}

// ---------------- data helpers (all computed on the client from events ≤ clock)
function eventsUpTo(t){return B.events.filter(e=>e.t<=t)}
function scoreAt(t){const s={home:0,away:0};for(const e of B.events){if(e.t>t)break;if(e.type==='shot'&&e.outcome==='goal')s[e.team]++}return s}
function playerLive(pid,t){
  const s={interceptions:0,tackles_won:0,blocks:0,pressures:0,passes:0,passes_complete:0,progressive:0,shots:0,goals:0,xg:0,ended:0,threat:0,xgp:0};
  for(const e of B.events){if(e.t>t)break;if(e.player!==pid)continue;
    if(e.type==='interception')s.interceptions++;else if(e.type==='tackle'&&e.outcome==='won')s.tackles_won++;
    else if(e.type==='block')s.blocks++;else if(e.type==='pressure')s.pressures++;
    else if(e.type==='pass'){s.passes++;if(e.outcome==='complete')s.passes_complete++;if(e.progressive)s.progressive++}
    else if(e.type==='shot'){s.shots++;s.xg+=e.xg;if(e.outcome==='goal')s.goals++}}
  for(const r of B.threat_prevented){if(r.t<=t&&r.player===pid){s.threat+=r.danger_stopped;s.xgp+=r.xg_prevented}}
  for(const p of B.possessions){if(p.end_t<=t&&p.ended_by===pid)s.ended++}
  return s;
}
function frameAt(t){const i=Math.max(0,Math.min(B.frames.rows.length-1,Math.round(t/B.meta.tick_seconds)));return B.frames.rows[i]}
function pos(row,pid){const k=B.frames.ids.indexOf(pid);return [row[3+2*k],row[4+2*k]]}
function momentsVisible(){return B.moments.filter(m=>!liveOnly||m.t<=clock)}

// ---------------- drawing
const C=$('#pitch').getContext('2d'); const PW=1050,PH=680,PAD=25; const L=105,W=68;
const sx=x=>PAD+x/L*(PW-2*PAD), sy=y=>PAD+y/W*(PH-2*PAD), cx=x=>Math.max(110,Math.min(PW-110,x));
function draw(){
  C.clearRect(0,0,PW,PH);
  for(let i=0;i<10;i++){C.fillStyle=i%2?'#335f46':'#2f5a41';C.fillRect(sx(i*10.5),0,(PW-2*PAD)/10+1,PH)}
  C.strokeStyle='rgba(255,255,255,.55)';C.lineWidth=2;
  C.strokeRect(sx(0),sy(0),sx(L)-sx(0),sy(W)-sy(0));
  C.beginPath();C.moveTo(sx(52.5),sy(0));C.lineTo(sx(52.5),sy(W));C.stroke();
  C.beginPath();C.arc(sx(52.5),sy(34),9.15/L*(PW-2*PAD),0,7);C.stroke();
  for(const [x0,dir] of [[0,1],[L,-1]]){C.strokeRect(sx(x0),sy(34-20.15),dir*16.5/L*(PW-2*PAD),40.3/W*(PH-2*PAD));C.strokeRect(sx(x0),sy(34-9.16),dir*5.5/L*(PW-2*PAD),18.32/W*(PH-2*PAD));}
  const row=frameAt(clock); if(!row)return;
  // focus trail
  if((mode==='player'||mode==='kid')&&focus){C.strokeStyle='rgba(242,179,91,.35)';C.lineWidth=3;C.beginPath();
    for(let t=Math.max(0,clock-8);t<=clock;t+=0.5){const r=frameAt(t);const [x,y]=pos(r,focus);t===Math.max(0,clock-8)?C.moveTo(sx(x),sy(y)):C.lineTo(sx(x),sy(y))}C.stroke();}
  // freeze frame extras
  if(freeze) drawFreeze(row);
  // what he sees
  if(sel&&visionOn){lastV=vision(clock,sel);drawVision(lastV,row);if(performance.now()-lastVboxAt>250){lastVboxAt=performance.now();updateVbox(lastV)}}
  // players
  for(const pid of B.frames.ids){const [x,y]=pos(row,pid);const p=B.meta.players.find(q=>q.id===pid);
    const isF=(mode==='player'||mode==='kid')&&pid===focus;
    if(isF){C.beginPath();C.arc(sx(x),sy(y),16,0,7);C.strokeStyle='#f2b35b';C.lineWidth=3;C.stroke();}
    if(sel===pid&&visionOn){C.beginPath();C.arc(sx(x),sy(y),14,0,7);C.strokeStyle='#7bc9a0';C.lineWidth=2.5;C.stroke();}
    C.beginPath();C.arc(sx(x),sy(y),p.role==='GK'?9:10,0,7);
    C.fillStyle=p.team==='home'?(p.role==='GK'?'#d9c27a':'#f3efe6'):(p.role==='GK'?'#9bb3d1':'#6f8fb8');C.fill();
    C.fillStyle=p.team==='home'?'#1a1408':'#0f1620';C.font='600 11px "Barlow Condensed"';C.textAlign='center';C.textBaseline='middle';C.fillText(p.number,sx(x),sy(y)+.5);
    if(isF){if(!(freeze&&freeze.moment.player===pid)){C.fillStyle='#f2b35b';C.font='600 13px "Barlow Condensed"';C.fillText(short(pid),sx(x),sy(y)-24)}}
    else{const pr=frameAt(Math.max(0,clock-0.5));const [qx,qy]=pos(pr,pid);const sp=Math.hypot(x-qx,y-qy)/0.5;if(sp>=7.5&&sp<12){C.fillStyle='rgba(243,239,230,.9)';C.font='500 11px Barlow';C.fillText(`${short(pid)} ${sp.toFixed(1)} m/s`,sx(x),sy(y)-18)}}
  }
  // ball
  C.beginPath();C.arc(sx(row[1]),sy(row[2]),6,0,7);C.fillStyle='#fff';C.fill();C.strokeStyle='#222';C.lineWidth=1.5;C.stroke();
  // caption
  const cap=$('#caption');
  if(feed){const it=feedItem&&feedItem.t_start<=clock&&clock<=feedItem.t_end?feedItem:null;
    if(it){cap.innerHTML=`${it.caption||it.text.en}<small>${it.kind.replace('_',' ')} · engine ${it.engine_latency_ms} ms${it.narration_latency_ms!=null?` · caption ${it.narration_latency_ms} ms (${it.caption_backend||'local'})`:''} · evidence ${it.evidence.slice(0,2).join(', ')}</small>`;cap.classList.add('show')}else cap.classList.remove('show');return}
  const item=B.overlay.find(o=>o.t_start<=clock&&clock<=o.t_end&&(!liveOnly||o.t_start<=clock));
  if(item){cap.innerHTML=`${item.text.en}<small>${item.kind.replace('_',' ')} · rank ${item.rank} · evidence ${item.evidence.slice(0,2).join(', ')}</small>`;cap.classList.add('show')}else cap.classList.remove('show');
}
function drawFreeze(row){
  const m=freeze.moment;
  if(m.kind==='key_pass'){const e=B.events.find(x=>x.id===m.evidence[0]);if(!e)return;
    C.strokeStyle='rgba(242,179,91,.95)';C.lineWidth=3;C.beginPath();C.moveTo(sx(e.x),sy(e.y));C.lineTo(sx(e.end_x),sy(e.end_y));C.stroke();
    C.beginPath();C.arc(sx(e.end_x),sy(e.end_y),14,0,7);C.strokeStyle='rgba(242,179,91,.9)';C.lineWidth=2;C.stroke();
    C.fillStyle='#f2b35b';C.font='600 13px "Barlow Condensed"';C.textAlign='center';
    C.fillText(`${short(e.player)} to ${short(e.receiver)} · ${e.distance} m · ${e.speed} m/s · difficulty ${e.difficulty}`,cx(sx((e.x+e.end_x)/2)),Math.max(40,sy((e.y+e.end_y)/2)-18));
    C.fillText(`danger ${e.danger_before} → ${e.danger_intended}`,cx(sx(e.end_x)),Math.min(PH-30,sy(e.end_y)+30));return}
  if(m.kind==='chance'||m.kind==='goal'){const e=B.events.find(x=>x.id===m.evidence[0]);if(!e)return;const gx=e.team==='home'?L:0;
    C.setLineDash([4,5]);C.strokeStyle=m.kind==='goal'?'rgba(242,179,91,.95)':'rgba(243,239,230,.8)';C.lineWidth=3;C.beginPath();C.moveTo(sx(e.x),sy(e.y));C.lineTo(sx(gx),sy(34));C.stroke();C.setLineDash([]);
    C.fillStyle='#f2b35b';C.font='600 13px "Barlow Condensed"';C.textAlign='center';C.fillText(`${short(e.player)} ${m.kind==='goal'?'GOAL':'shot'} · ${e.distance} m · xG ${e.xg} · ${e.speed} m/s`,cx(sx(e.x)),sy(e.y)-26);return}
  if(m.kind!=='stop')return;
  const ev=B.events.find(e=>e.id===m.evidence[0]); if(!ev)return;
  const pid=ev.player; const [px,py]=pos(row,pid);
  const gx=teamOf(pid)==='home'?0:L;
  // the line he screens: ball to own goal
  C.setLineDash([6,6]);C.strokeStyle='rgba(242,179,91,.6)';C.lineWidth=2;C.beginPath();C.moveTo(sx(row[1]),sy(row[2]));C.lineTo(sx(gx),sy(34));C.stroke();C.setLineDash([]);
  // reach
  C.beginPath();C.arc(sx(px),sy(py),5/L*(PW-2*PAD),0,7);C.fillStyle='rgba(123,201,160,.18)';C.fill();
  if(ev.type==='interception'){const ps=B.events.find(e=>e.id===ev.pass_id); if(ps){
    C.setLineDash([4,5]);C.strokeStyle='rgba(255,106,77,.9)';C.lineWidth=3;C.beginPath();C.moveTo(sx(ps.x),sy(ps.y));C.lineTo(sx(ps.end_x),sy(ps.end_y));C.stroke();C.setLineDash([]);
    const rx=ps.end_x,ry=ps.end_y; C.beginPath();C.arc(sx(rx),sy(ry),14,0,7);C.strokeStyle='rgba(255,106,77,.9)';C.lineWidth=2;C.stroke();
    C.fillStyle='#ff6a4d';C.font='600 13px "Barlow Condensed"';C.textAlign='center';C.fillText(`intended: ${short(ps.receiver)} · danger ${ps.danger_intended}`,cx(sx(rx)),Math.min(PH-30,sy(ry)+34));
    if(freeze.ghost!==null){const g=freeze.ghost;const bx=ev.x+(rx-ev.x)*g,by=ev.y+(ry-ev.y)*g;C.beginPath();C.arc(sx(bx),sy(by),6,0,7);C.fillStyle='rgba(255,255,255,.45)';C.fill();C.strokeStyle='#ff6a4d';C.stroke();
      if(g>=1){C.fillStyle='#ff6a4d';C.font='600 15px "Barlow Condensed"';C.textAlign='right';C.fillText('without him, the pass arrives',PW-PAD-10,PH-PAD-12);C.textAlign='center'}}
  }}
  C.fillStyle='#f2b35b';C.font='600 13px "Barlow Condensed"';C.textAlign='center';C.fillText(`${short(pid)} ${ev.type} · danger ${m.detail.danger_stopped} stopped`,cx(sx(px)),sy(py)-26);

function buildTimeline(){

    b.dataset.t=m.t;b.title=`${fmt(m.t)} ${m.kind}${m.player?' · '+name(m.player):''}`;b.setAttribute('aria-label',b.title);b.onclick=()=>jumpTo(m);tl.appendChild(b)}
  for(const [t,l] of [[0,'KO'],[2700,'HT'],[5399,'FT']]){const s=document.createElement('span');s.className='half';s.style.left=(t/B.clock*100)+'%';s.textContent=l;tl.appendChild(s)}
}
let lastTickSec=-1;
function updateTicks(){const s=Math.floor(clock);if(s===lastTickSec)return;lastTickSec=s;document.querySelectorAll('#timeline .tick').forEach(b=>{b.style.visibility=(liveOnly&&+b.dataset.t>clock)?'hidden':'visible'})}
function jumpTo(m,ghost=false){playing=false;$('#play').textContent='Play';clock=m.t;if(m.kind==='key_pass'){const e=B.events.find(x=>x.id===m.evidence[0]);if(e&&e.t_start!=null)clock=e.t_start}freeze={moment:m,ghost:ghost?0:null};renderPanel()}

function storyFor(md,pid){const it=B.stories.items;return it[`${md}|${lang}|${pid||''}`]||it[`${md}|en|${pid||''}`]||null}
function factsHtml(story){if(!story)return'';const used=story.facts_used||[];
  return `<button class="why" data-toggle="facts">Why? Show the ${used.length} facts behind this</button> <button class="why" data-toggle="trace">How the agents wrote it</button><div class="facts">${used.map(f=>`<div><code>${f.id}</code><span>${f.text}</span>${f.evidence.length?`<button data-ev="${f.evidence[0]}">see ${f.evidence[0]}</button>`:''}</div>`).join('')}</div>${traceHtml(story)}`}
function traceHtml(s){if(!s.trace||!s.trace.length)return'';return `<div class="trace">${s.trace.map(t=>{let body='';if(t.agent==='Verifier'||t.agent==='Final check'){body=`<span class="v ${t.verdict.startsWith('accepted')?'':'no'}">${t.verdict}</span> · ${t.kept} kept, ${t.rejected} rejected`+(t.problems&&t.problems.length?`<div class="txt">${t.problems.map(p=>`<span class="bad">${p.text}</span> <span class="what">${p.problems.join('; ')}</span>`).join('<br>')}</div>`:'')}else if(t.text){body=`<div class="txt">${t.text.replace(/\[f\d+(?:,\s*f\d+)*\]/g,m=>`<span class="what">${m}</span>`)}</div>`}else body=`<span class="what">${t.step}</span>`;return `<div class="tstep"><div class="who">${t.agent}<small>${t.step} · ${t.ms} ms${t.backend?' · '+t.backend:''}</small></div><div>${body}</div></div>`}).join('')}</div>`}
function storyBlock(md,pid){const s=storyFor(md,pid);if(!s)return'<p class="why">No story for this view yet.</p>';

function toggleFeed(){

  playing=false;$('#play').textContent='Play';freeze=null;
  const url=`/api/stream?speed=${speed}&start=${Math.floor(clock)}&narrate=true`;
  feed=new EventSource(url);feedStats={engine:null,narr:null,n:0};
  $('#feed').classList.add('on');const st=$('#feedStatus');st.hidden=false;st.textContent='connecting…';
  feed.addEventListener('hello',e=>{const d=JSON.parse(e.data);st.textContent=`${d.speed}× · ${d.events} events`});
  feed.addEventListener('match',e=>{const d=JSON.parse(e.data);clock=d.event.t;});
  feed.addEventListener('overlay',e=>{const d=JSON.parse(e.data);feedItem=d;feedStats.n++;feedStats.engine=d.engine_latency_ms;feedStats.narr=d.narration_latency_ms;
    st.textContent=`${speed}× · engine ${d.engine_latency_ms} ms${d.narration_latency_ms!=null?` · caption ${Math.round(d.narration_latency_ms)} ms`:''}`;
    if(!B.moments.some(m=>m.evidence[0]===d.evidence[0])){B.moments.push({kind:d.kind,t:d.t_start,minute:Math.floor(d.t_start/60),team:d.team,player:d.player,score:0,evidence:d.evidence,detail:d.detail,x:d.x,y:d.y,rank:B.moments.length+1});buildTimeline();lastTickSec=-1}
    if(mode==='player'||mode==='analyst')renderPanel()});
  feed.addEventListener('end',()=>{st.textContent='feed ended · full time';feed.close();feed=null;});
  feed.onerror=()=>{st.textContent='feed unavailable: run the server (uvicorn shield.server:app), the static page has no stream'};
}

// ---------------- what he sees (mirror of shield/engine/vision.py)
const LANE_REACH=3.0, CONTEST_REACH=5.0, TACKLE_REACH=2.2, POST=3.66;
const meta=pid=>B.meta.players.find(p=>p.id===pid);
function seg(px,py,ax,ay,bx,by){const abx=bx-ax,aby=by-ay,ab2=abx*abx+aby*aby;if(!ab2)return [Math.hypot(px-ax,py-ay),0];const t=((px-ax)*abx+(py-ay)*aby)/ab2,tc=Math.max(0,Math.min(1,t));return [Math.hypot(px-(ax+abx*tc),py-(ay+aby*tc)),t]}
function inTri(px,py,ax,ay,bx,by,cx_,cy_){const s=(x1,y1,x2,y2,x3,y3)=>(x1-x3)*(y2-y3)-(x2-x3)*(y1-y3);const d1=s(px,py,ax,ay,bx,by),d2=s(px,py,bx,by,cx_,cy_),d3=s(px,py,cx_,cy_,ax,ay);return !((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0))}
function possTeamAt(t){for(const p of B.possessions){if(p.start_t<=t&&t<=p.end_t)return p.team}return null}
const goalOf=team=>[team==='home'?L:0,W/2], ownGoal=team=>[team==='home'?0:L,W/2], dirn=team=>team==='home'?1:-1;
function dangerAt(team,x,y,row){const d=dirn(team);const [gx,gy]=goalOf(team);const dist=Math.hypot(gx-x,gy-y);const base=Math.exp(-dist/20);let att=0,de=0;
  for(const pid of B.frames.ids){const m=meta(pid);const [px,py]=pos(row,pid);if(m.team===team){if(m.role!=='GK'&&(px-x)*d>0&&Math.hypot(px-x,py-y)<25)att++}else{if((px-x)*d>0&&Math.abs(py-y)<20&&(px-x)*d<30)de++}}
  return Math.round(Math.min(1,base*(1+0.08*att)/(1+0.18*de))*1000)/1000}
function carrierAt(row,team){if(!team)return null;const [bx,by]=[row[1],row[2]];let best=null,bd=99;for(const pid of B.frames.ids){if(meta(pid).team!==team)continue;const [x,y]=pos(row,pid);const d=Math.hypot(x-bx,y-by);if(d<bd){best=pid;bd=d}}return bd<=6?best:null}
function laneJS(row,frm,to){const team=meta(frm).team;const [ax,ay]=pos(row,frm),[bx,by]=pos(row,to);const dist=Math.hypot(bx-ax,by-ay);let closest=null,closer=99,laneP=0,oppNear=99;
  for(const pid of B.frames.ids){const m=meta(pid);const [x,y]=pos(row,pid);if(m.team!==team){oppNear=Math.min(oppNear,Math.hypot(x-bx,y-by));if(m.role==='GK')continue;const [ds,tp]=seg(x,y,ax,ay,bx,by);if(tp>0.1&&tp<0.95){if(ds<closer){closest=pid;closer=ds}if(ds<LANE_REACH)laneP+=0.07*(1-ds/LANE_REACH)}}}
  const difficulty=Math.round(100*Math.min(1,0.45*Math.min(dist/45,1)+0.3*(1-Math.min(oppNear,12)/12)+0.25*Math.min(1,laneP*3)));
  const state=closer<LANE_REACH?'blocked':closer<CONTEST_REACH?'contested':'open';const d0=dangerAt(team,ax,ay,row),d1=dangerAt(team,bx,by,row);
  return {to,to_name:name(to),distance:Math.round(dist*10)/10,state,closest,closest_m:closest?Math.round(closer*10)/10:null,receiver_space_m:Math.round(oppNear*10)/10,difficulty,danger_now:d0,danger_if_arrives:d1,gain:Math.round((d1-d0)*1000)/1000,from_xy:[ax,ay],to_xy:[bx,by]}}
function vision(t,pid){const row=frameAt(t);const m=meta(pid);const team=m.team;const poss=possTeamAt(t);const [x,y]=pos(row,pid);const [bx,by]=[row[1],row[2]];
  const out={t,player:pid,name:m.name,team,role:m.role,xy:[x,y],ball:[bx,by],in_possession:poss===team,dist_to_ball:Math.round(Math.hypot(x-bx,y-by)*10)/10};
  const carrier=carrierAt(row,poss);
  if(poss===team&&carrier===pid){const lanes=[];const [ogx]=ownGoal(team);
    for(const q of B.frames.ids){if(q===pid||meta(q).team!==team)continue;const [qx,qy]=pos(row,q);const dist=Math.hypot(qx-x,qy-y);if(dist<4||dist>(m.role==='GK'?65:42))continue;if(meta(q).role==='GK'&&Math.abs(x-ogx)>35)continue;lanes.push(laneJS(row,pid,q))}
    lanes.sort((a,b)=>b.gain-a.gain);const open=lanes.filter(l=>l.state==='open');const best=open.length?open.reduce((a,b)=>b.gain>a.gain?b:a):null;
    const pressure=B.frames.ids.filter(q=>meta(q).team!==team&&meta(q).role!=='GK'&&Math.hypot(pos(row,q)[0]-x,pos(row,q)[1]-y)<3.5);
    Object.assign(out,{view:'carrier',lanes,options:lanes.length,open:open.length,blocked:lanes.filter(l=>l.state==='blocked').length,best,under_pressure_from:pressure,danger_here:dangerAt(team,x,y,row)});
    out.read=best?`${m.name} has ${lanes.length} options, ${open.length} open. Best: ${short(best.to)}, danger ${best.danger_now} to ${best.danger_if_arrives}, difficulty ${best.difficulty}.`:`${m.name} has ${lanes.length} options and none open. Keep it or carry.`;
    if(pressure.length)out.read+=` Pressed by ${pressure.map(short).join(', ')}.`;return out}
  if(poss&&poss!==team){const closing=[];
    if(carrier){const [cxp,cyp]=pos(row,carrier);for(const q of B.frames.ids){if(q===carrier||meta(q).team!==poss)continue;const [qx,qy]=pos(row,q);if(Math.hypot(qx-cxp,qy-cyp)<4)continue;const [ds,tp]=seg(x,y,cxp,cyp,qx,qy);if(tp>0.1&&tp<0.95&&ds<CONTEST_REACH)closing.push({to:q,to_name:name(q),from_xy:[cxp,cyp],to_xy:[qx,qy],my_distance_to_lane:Math.round(ds*10)/10,state:ds<LANE_REACH?'closed':'contested',danger_if_arrives:dangerAt(poss,qx,qy,row)})}}
    const [gx,gy]=ownGoal(team);const inWedge=inTri(x,y,bx,by,gx,gy-POST,gx,gy+POST);const [dline]=seg(x,y,bx,by,gx,gy);
    let marking=null,md=99;for(const q of B.frames.ids){if(meta(q).team!==poss||meta(q).role==='GK')continue;const [qx,qy]=pos(row,q);const d=Math.hypot(qx-x,qy-y);if(d<md){marking=q;md=d}}
    closing.sort((a,b)=>b.danger_if_arrives-a.danger_if_arrives);
    Object.assign(out,{view:'defender',carrier,closing,in_goal_wedge:inWedge,distance_to_ball_goal_line:Math.round(dline*10)/10,can_tackle:Math.hypot(x-bx,y-by)<=TACKLE_REACH,marking,marking_m:Math.round(md*10)/10,wedge:{ball:[bx,by],posts:[[gx,gy-POST],[gx,gy+POST]]}});
    const closed=closing.filter(c=>c.state==='closed');const bits=[];
    if(closed.length)bits.push(`closing ${closed.length} lane${closed.length!==1?'s':''} (most dangerous: to ${short(closed[0].to)}, danger ${closed[0].danger_if_arrives})`);
    bits.push(inWedge?'between the ball and his goal':`${Math.round(dline)} m off the ball-to-goal line`);
    if(out.can_tackle)bits.push('in tackling range');else if(out.dist_to_ball<8)bits.push(`${out.dist_to_ball} m from the ball`);
    out.read=`${m.name}: ${bits.join(', ')}.`;return out}
  let space=99;for(const q of B.frames.ids){if(meta(q).team===team)continue;const [qx,qy]=pos(row,q);space=Math.min(space,Math.hypot(qx-x,qy-y))}
  Object.assign(out,{view:'attacker',space_m:Math.round(space*10)/10,danger_here:dangerAt(team,x,y,row)});
  if(carrier&&carrier!==pid&&meta(carrier).team===team){out.lane_from_carrier=laneJS(row,carrier,pid);out.carrier=carrier;out.read=`${m.name} is ${out.lane_from_carrier.state} for a pass from ${short(carrier)}, ${out.space_m} m of space, danger here ${out.danger_here}.`}
  else out.read=`${m.name} has ${out.space_m} m of space, danger here ${out.danger_here}.`;
  return out}
const laneColor={open:'rgba(123,201,160,.9)',contested:'rgba(242,179,91,.9)',blocked:'rgba(255,106,77,.9)',closed:'rgba(123,201,160,.95)'};
function drawVision(v,row){const [x,y]=v.xy;
  if(v.view==='carrier'){for(const l of v.lanes){const best=v.best&&l.to===v.best.to;C.setLineDash(l.state==='open'?[]:[5,5]);C.strokeStyle=laneColor[l.state];C.lineWidth=best?4:1.8;C.beginPath();C.moveTo(sx(l.from_xy[0]),sy(l.from_xy[1]));C.lineTo(sx(l.to_xy[0]),sy(l.to_xy[1]));C.stroke();C.setLineDash([]);
      if(l.state==='blocked'&&l.closest){const [qx,qy]=pos(row,l.closest);C.beginPath();C.arc(sx(qx),sy(qy),13,0,7);C.strokeStyle='rgba(255,106,77,.8)';C.lineWidth=2;C.stroke()}
      if(best||l.state!=='open'){C.fillStyle=laneColor[l.state];C.font='600 11px "Barlow Condensed"';C.textAlign='center';const mx=(l.from_xy[0]+l.to_xy[0])/2,my=(l.from_xy[1]+l.to_xy[1])/2;C.fillText(best?`best · ${l.difficulty}`:`${l.difficulty}`,sx(mx),sy(my)-6)}}
    if(v.under_pressure_from.length){C.beginPath();C.arc(sx(x),sy(y),3.5/L*(PW-2*PAD),0,7);C.strokeStyle='rgba(255,106,77,.6)';C.lineWidth=1.5;C.setLineDash([3,4]);C.stroke();C.setLineDash([])}}
  else if(v.view==='defender'){const w=v.wedge;C.beginPath();C.moveTo(sx(w.ball[0]),sy(w.ball[1]));C.lineTo(sx(w.posts[0][0]),sy(w.posts[0][1]));C.lineTo(sx(w.posts[1][0]),sy(w.posts[1][1]));C.closePath();C.fillStyle=v.in_goal_wedge?'rgba(123,201,160,.16)':'rgba(255,106,77,.12)';C.fill();
    for(const c of v.closing){C.setLineDash([5,5]);C.strokeStyle=c.state==='closed'?'rgba(255,106,77,.85)':'rgba(242,179,91,.7)';C.lineWidth=c.state==='closed'?2.5:1.5;C.beginPath();C.moveTo(sx(c.from_xy[0]),sy(c.from_xy[1]));C.lineTo(sx(c.to_xy[0]),sy(c.to_xy[1]));C.stroke();C.setLineDash([]);
      if(c.state==='closed'){C.fillStyle='rgba(255,106,77,.95)';C.font='600 11px "Barlow Condensed"';C.textAlign='center';const mx=(c.from_xy[0]+c.to_xy[0])/2,my=(c.from_xy[1]+c.to_xy[1])/2;C.fillText(`${short(c.to)} · danger ${c.danger_if_arrives}`,cx(sx(mx)),sy(my)+14)}}
    C.beginPath();C.arc(sx(x),sy(y),TACKLE_REACH/L*(PW-2*PAD),0,7);C.fillStyle=v.can_tackle?'rgba(123,201,160,.35)':'rgba(123,201,160,.15)';C.fill();
    if(v.marking&&v.marking_m<6){const [qx,qy]=pos(row,v.marking);C.setLineDash([2,4]);C.strokeStyle='rgba(243,239,230,.6)';C.lineWidth=1;C.beginPath();C.moveTo(sx(x),sy(y));C.lineTo(sx(qx),sy(qy));C.stroke();C.setLineDash([])}}
  else{if(v.lane_from_carrier){const l=v.lane_from_carrier;C.setLineDash(l.state==='open'?[]:[5,5]);C.strokeStyle=laneColor[l.state];C.lineWidth=2;C.beginPath();C.moveTo(sx(l.from_xy[0]),sy(l.from_xy[1]));C.lineTo(sx(l.to_xy[0]),sy(l.to_xy[1]));C.stroke();C.setLineDash([])}
    C.beginPath();C.arc(sx(x),sy(y),Math.min(v.space_m,12)/L*(PW-2*PAD),0,7);C.strokeStyle='rgba(243,239,230,.45)';C.lineWidth=1;C.setLineDash([3,4]);C.stroke();C.setLineDash([])}}
function updateVbox(v){const b=$('#vbox');b.classList.toggle('right',v.xy[0]<L/2);let h=`<b>${v.read}</b>`;
  if(v.view==='carrier')h+=v.lanes.slice(0,4).map(l=>`<div class="opt"><i style="background:${laneColor[l.state]}"></i><span class="k">${short(l.to)}</span><span>${l.state} · ${l.distance} m · difficulty ${l.difficulty} · danger ${l.danger_now}→${l.danger_if_arrives}</span></div>`).join('');
  else if(v.view==='defender')h+=v.closing.slice(0,3).map(c=>`<div class="opt"><i style="background:${c.state==='closed'?laneColor.blocked:laneColor.contested}"></i><span class="k">${short(c.to)}</span><span>${c.state} · ${c.my_distance_to_lane} m from the lane · danger if it arrives ${c.danger_if_arrives}</span></div>`).join('')+(v.marking?`<div class="opt"><i style="background:rgba(243,239,230,.6)"></i><span class="k">${short(v.marking)}</span><span>nearest opponent, ${v.marking_m} m</span></div>`:'');
  b.innerHTML=h;b.classList.add('show')}


// ---------------- mini pitch diagrams for the playbook
function miniPitch(canvas,d,pid){const g=canvas.getContext('2d');const MW=400,MH=260,MP=10;const mx=x=>MP+x/L*(MW-2*MP),my=y=>MP+y/W*(MH-2*MP);const team=teamOf(pid);const dir=team==='home'?1:-1;
  g.clearRect(0,0,MW,MH);g.fillStyle='#2f5a41';g.fillRect(0,0,MW,MH);g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=1.5;
  g.strokeRect(mx(0),my(0),mx(L)-mx(0),my(W)-my(0));g.beginPath();g.moveTo(mx(52.5),my(0));g.lineTo(mx(52.5),my(W));g.stroke();g.beginPath();g.arc(mx(52.5),my(34),9.15/L*(MW-2*MP),0,7);g.stroke();
  for(const [x0,dd] of [[0,1],[L,-1]]){g.strokeRect(mx(x0),my(34-20.15),dd*16.5/L*(MW-2*MP),40.3/W*(MH-2*MP))}
  // direction of attack
  g.fillStyle='rgba(255,255,255,.5)';g.font='500 12px Barlow';g.font='500 14px Barlow';g.textAlign=dir>0?'right':'left';g.fillText(dir>0?'attacks this way →':'← attacks this way',dir>0?MW-14:14,MH-16);
  const ev=id=>B.events.find(e=>e.id===id);
  if(d.kind==='heat_defending'||d.kind==='heat_all'){const k=B.frames.ids.indexOf(pid);for(let i=0;i<B.frames.rows.length;i+=6){const r=B.frames.rows[i];if(d.kind==='heat_defending'&&possTeamAt(r[0])===team)continue;g.beginPath();g.arc(mx(r[3+2*k]),my(r[4+2*k]),9,0,7);g.fillStyle='rgba(242,179,91,.07)';g.fill()}
    if(d.kind==='heat_defending'&&d.screen){const [gx,gy]=ownGoal(team);g.strokeStyle='rgba(243,239,230,.6)';g.setLineDash([4,4]);g.beginPath();g.moveTo(mx(52.5),my(34));g.lineTo(mx(gx),my(gy));g.stroke();g.setLineDash([])}}
  else if(d.kind==='intercepts'){for(const id of d.ids){const e=ev(id);if(!e)continue;const ps=B.events.find(x=>x.id===e.pass_id);if(ps){g.strokeStyle='rgba(255,106,77,.75)';g.setLineDash([3,3]);g.lineWidth=1.5;g.beginPath();g.moveTo(mx(ps.x),my(ps.y));g.lineTo(mx(ps.end_x),my(ps.end_y));g.stroke();g.setLineDash([])}g.beginPath();g.arc(mx(e.x),my(e.y),5,0,7);g.fillStyle='#7bc9a0';g.fill()}}
  else if(d.kind==='dots'){for(const id of d.ids){const e=ev(id);if(!e)continue;g.beginPath();g.arc(mx(e.x),my(e.y),5,0,7);g.fillStyle='#7bc9a0';g.fill()}}
  else if(d.kind==='shots'){for(const id of d.ids){const e=ev(id);if(!e)continue;g.beginPath();g.arc(mx(e.x),my(e.y),4+e.xg*18,0,7);g.fillStyle=e.outcome==='goal'?'#f2b35b':'rgba(243,239,230,.7)';g.fill()}}
  else if(d.kind==='arrows'){for(const id of d.ids){const e=ev(id);if(!e)continue;g.strokeStyle=e.type==='carry'?'rgba(242,179,91,.8)':'rgba(243,239,230,.75)';g.lineWidth=1.6;g.beginPath();g.moveTo(mx(e.x),my(e.y));g.lineTo(mx(e.end_x),my(e.end_y));g.stroke();g.beginPath();g.arc(mx(e.end_x),my(e.end_y),2.5,0,7);g.fillStyle=g.strokeStyle;g.fill()}}
  else if(d.kind==='win_then'){for(const id of d.ids){const e=ev(id);if(!e)continue;g.beginPath();g.arc(mx(e.x),my(e.y),4,0,7);g.fillStyle='#7bc9a0';g.fill();
      const nxt=B.events.find(x=>x.t>e.t&&x.t<e.t+6&&x.player===pid&&(x.type==='pass'||x.type==='carry'));if(nxt){g.strokeStyle=nxt.type==='carry'?'rgba(242,179,91,.85)':'rgba(243,239,230,.8)';g.lineWidth=1.6;g.beginPath();g.moveTo(mx(e.x),my(e.y));g.lineTo(mx(nxt.end_x),my(nxt.end_y));g.stroke()}}}
  else if(d.kind==='thirds'){const sh=d.shares||{};const names=['defensive third','middle third','attacking third'];for(let i=0;i<3;i++){const share=sh[names[i]]||0;const u0=i/3,u1=(i+1)/3;const x0=dir>0?u0*L:(1-u1)*L,x1=dir>0?u1*L:(1-u0)*L;g.fillStyle=`rgba(242,179,91,${0.08+share*0.6})`;g.fillRect(mx(x0),my(0),mx(x1)-mx(x0),my(W)-my(0));g.fillStyle='rgba(243,239,230,.9)';g.font='600 18px "Barlow Condensed"';g.textAlign='center';g.fillText(`${Math.round(share*100)}%`,mx((x0+x1)/2),my(34)+6)}}
}

function pretty(k){return k.replace('_p90',' per 90').replace(/_/g,' ')}
function fmtv(k,v){if(k==='possession'||k==='pass_accuracy')return Math.round(v*100)+'%';return typeof v==='number'?(Number.isInteger(v)?v:v.toFixed(2)):v}
function wirePanel(){
  const P=$('#panel');
  P.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const box=b.parentElement.querySelector('.'+b.dataset.toggle);if(box)box.classList.toggle('open')});
  P.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>{const e=B.events.find(x=>x.id===b.dataset.ev);if(e){playing=false;$('#play').textContent='Play';clock=Math.max(0,e.t-3);freeze=null}});
  P.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>jumpTo(B.moments.find(m=>m.rank==+b.dataset.jump)));
  P.querySelectorAll('[data-ghost]').forEach(b=>b.onclick=()=>{const m=B.moments.find(x=>x.rank==+b.dataset.ghost);jumpTo(m,true);showCounterfactual(m)});
  P.querySelectorAll('[data-arch]').forEach(b=>b.onclick=()=>{focus=b.dataset.arch;renderPanel()});
  const f=$('#focus');if(f)f.onchange=()=>{focus=f.value;renderPanel()};
  const l=$('#lang');if(l)l.onchange=()=>{lang=l.value;renderPanel()};
  const c=$('#club');if(c)c.onchange=()=>{club=c.value;renderPanel()};
  const ms=$('#matchStyle');if(ms)ms.onclick=matchStyle;
  const lb=$('#lieBtn');if(lb)lb.onclick=async()=>{const out=$('#lieOut');out.innerHTML='<p class="why">checking…</p>';try{const r=await fetch('/api/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:$('#lieText').value})});const d=await r.json();const rep=d.report;
    out.innerHTML=`<div class="trace open">${rep.sentences.map(x=>`<div class="tstep"><div class="who"><span class="v ${x.ok?'':'no'}">${x.ok?'kept':'rejected'}</span></div><div><div class="txt ${x.ok?'':'bad'}">${x.text}</div>${x.problems.length?`<span class="what">${x.problems.join('; ')}</span>`:''}</div></div>`).join('')}<p class="why">Facts it can cite right now: ${d.facts.map(f=>`<code>${f.id}</code> ${f.text}`).slice(0,5).join(' · ')}</p></div>`}catch(e){out.innerHTML='<p class="why">No server here. Run uvicorn shield.server:app to try this.</p>'}};
}
function showCounterfactual(m){
  const ev=B.events.find(e=>e.id===m.evidence[0]); const d=m.detail.danger_stopped;
  const done=B.possessions.filter(p=>p.outcome!=='ongoing'); const reached=done.filter(p=>p.peak_danger>=d);
  const n=reached.length, shots=reached.filter(p=>p.outcome==='shot'||p.outcome==='goal').length, goals=reached.filter(p=>p.outcome==='goal').length;
  const box=document.createElement('div');box.className='cf';
  box.innerHTML=`<b class="big">${n?Math.round(shots/n*100):0}%</b> of the ${n} attacks in this match that reached danger ${d} ended in a shot, and ${n?Math.round(goals/n*100):0}% in a goal. ${name(ev.player)} ended this one at ${fmt(ev.t)}. <span class="why">Computed from this match's own possessions, not a scripted animation.</span>`;
  const old=$('#panel .cf');if(old)old.remove();$('#panel').prepend(box);
}
function matchStyle(){
  const g=k=>+$('#kid_'+k).value||0; const min=g('minutes')||60, sc=90/min;
  const kid={passes_p90:g('passes')*sc,pass_accuracy:g('passes')?g('passes_complete')/g('passes'):0,shots_p90:g('shots')*sc,goals_p90:g('goals')*sc,tackles_won_p90:g('tackles_won')*sc,interceptions_p90:g('interceptions')*sc};
  const keys=Object.keys(kid); const shape=v=>{const a=keys.map(k=>+v[k]||0);const mx=Math.max(...a)||1;return a.map(x=>x/mx)};
  const ks=shape(kid); const rows=Object.entries(B.fingerprints).map(([id,f])=>{const ps=shape(f.metrics);return [Math.sqrt(ps.reduce((s,x,i)=>s+(x-ks[i])**2,0)),id,f]}).sort((a,b)=>a[0]-b[0]);
  const [d,id,f]=rows[0];
  $('#styleOut').innerHTML=`<div class="cf">You play most like <b>${f.archetype_label}</b>: closest to ${f.name}${rows[1]?`, then ${rows[1][2].name}`:''}. <button data-arch="${id}">Train like him</button></div>`;
  $('#styleOut').querySelector('[data-arch]').onclick=()=>{focus=id;renderPanel()};
}
